name: release

# 打 tag 触发自动打包并发布 GitHub Release；手动触发只构建不发布。
# tag 约定：v{semver}，例如 v1.2.0、v1.2.0-rc1（含预发布标识符自动识别为 prerelease）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 需要 write 权限来创建 Release 和上传 assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - vs-target: vs2022
            runs-on: windows-2022
          - vs-target: vs2026
            runs-on: windows-2025-vs2026
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $matches[1]
          } else {
            $manifest = Get-Content "src/VsMcp/source.extension.vsixmanifest.${{ matrix.vs-target }}" -Raw
            if ($manifest -match '<Identity[^>]*\sVersion="([^"]+)"') {
              $version = $matches[1]
            }
          }
          if (-not $version) {
            throw "Could not extract version (tag=${env:GITHUB_REF})"
          }

          $isPrerelease = $version.Contains('-')
          "version=$version"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version (prerelease=$isPrerelease)"

      # 把 tag 版本号注入对应的 vsixmanifest 文件。
      # 注意：成败要看「正则是否命中」，不能看「内容是否变化」——dispatch 时 version 从 manifest
      # 读出再写回、或 tag 版本恰好等于 manifest 现值时，替换必然无变化，按内容比较会把成功误判成失败。
      - name: Patch VSIX manifest version
        shell: pwsh
        run: |
          $manifestPath = "src/VsMcp/source.extension.vsixmanifest.${{ matrix.vs-target }}"
          $content = [IO.File]::ReadAllText($manifestPath)
          $version = '${{ steps.version.outputs.version }}'
          $pattern = '(<Identity\s[^>]*?\sVersion=")[^"]+(")'
          $regex = [regex]$pattern
          if (-not $regex.IsMatch($content)) {
            throw "Identity/Version 属性未找到，无法 patch：$manifestPath"
          }
          $patched = $regex.Replace($content, "`${1}${version}`${2}")
          [IO.File]::WriteAllText($manifestPath, $patched)
          Write-Host "Patched Version -> $version in $manifestPath (changed=$($patched -ne $content))"

      - name: Build Release VSIX (${{ matrix.vs-target }})
        run: msbuild src\VsMcp\VsMcp.csproj /p:Configuration=Release /p:VsTarget=${{ matrix.vs-target }} /p:EvalCsharpEnabled=false /v:minimal /nologo

      - name: Package artifact + SHA256
        id: package
        shell: pwsh
        run: |
          $src = Get-ChildItem "src/VsMcp/bin/Release/net48/VsMcp-${{ matrix.vs-target }}.vsix" -ErrorAction Stop
          $version = '${{ steps.version.outputs.version }}'
          $dest = "VsMcp-${{ matrix.vs-target }}-$version.vsix"
          Copy-Item $src.FullName $dest

          $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
          "$hash *$dest" | Out-File -FilePath "$dest.sha256" -Encoding ascii -NoNewline

          Write-Host "Artifact: $dest ($([math]::Round($src.Length / 1KB, 1)) KB)"
          Write-Host "SHA256: $hash"
          "filename=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VsMcp-${{ matrix.vs-target }}
          path: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
