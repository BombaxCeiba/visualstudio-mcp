name: release

# 打 tag 触发自动打包并发布 GitHub Release；手动触发只构建不发布。
# tag 约定：v{semver}，例如 v1.2.0、v1.2.0-rc1（含预发布标识符自动识别为 prerelease）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 需要 write 权限来创建 Release 和上传 assets

jobs:
  build:
    strategy:
      matrix:
        include:
          - vs-target: vs2022
            runs-on: windows-2022
          - vs-target: vs2026
            runs-on: windows-2025-vs2026
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # VS2022 的 MSBuild 17 与 windows-2022 runner 预装的 .NET SDK 10 不兼容（SDK 10 要
      # MSBuild 18）。装 SDK 9 + CI-only global.json 把 resolver 锚到 9.x。global.json 不进
      # repo：本地仅 SDK 10 + VS2026 MSBuild 18，进 repo 会 break 本地构建。vs2026(MSBuild18
      # +SDK10) 兼容，不需要。
      - name: Setup .NET 9 SDK (vs2022)
        if: matrix.vs-target == 'vs2022'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET SDK to 9.x (vs2022, CI-only global.json)
        if: matrix.vs-target == 'vs2022'
        shell: pwsh
        run: |
          '{"sdk":{"version":"9.0.100","rollForward":"latestFeature","allowPrerelease":false}}' | Out-File global.json -Encoding utf8NoBOM
          Write-Host "global.json:"; Get-Content global.json

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $matches[1]
          } else {
            # 单一真相源：dispatch（不发布）从 Directory.Build.props 的 VsMcpVersion 读版本号
            $props = Get-Content "src/Directory.Build.props" -Raw
            if ($props -match '<VsMcpVersion>([^<]+)</VsMcpVersion>') {
              $version = $matches[1].Trim()
            }
          }
          if (-not $version) {
            throw "Could not extract version (tag=${env:GITHUB_REF})"
          }

          $isPrerelease = $version.Contains('-')
          "version=$version"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version (prerelease=$isPrerelease)"

      # 版本号由构建时的 VsMcp.csproj PatchManifestVersion target 从 /p:VsMcpVersion 注入 manifest，
      # AssemblyInformationalVersion 注入代码（单一真相源 Directory.Build.props），不再单独 patch 文件。

      # VS 的 msbuild 不像 dotnet build 自动 NuGet restore，CI 全新 checkout 需显式 restore
      # （否则 NETSDK1004 project.assets.json not found）。传同样的 VsTarget/VsMcpVersion，
      # 因 STJ/BCL/Encodings 的 NuGet 版本随 VsTarget 变。ProjectReference 级联 restore Gateway。
      - name: Restore NuGet packages
        run: msbuild src\VsMcp\VsMcp.csproj /t:Restore /p:Configuration=Release /p:VsTarget=${{ matrix.vs-target }} /p:VsMcpVersion=${{ steps.version.outputs.version }} /p:EvalCsharpEnabled=false /v:minimal /nologo

      - name: Build Release VSIX (${{ matrix.vs-target }})
        run: msbuild src\VsMcp\VsMcp.csproj /p:Configuration=Release /p:VsTarget=${{ matrix.vs-target }} /p:VsMcpVersion=${{ steps.version.outputs.version }} /p:EvalCsharpEnabled=false /v:minimal /nologo

      - name: Package artifact + SHA256
        id: package
        shell: pwsh
        run: |
          $src = Get-ChildItem "src/VsMcp/bin/Release/net48/VsMcp-${{ matrix.vs-target }}.vsix" -ErrorAction Stop
          $version = '${{ steps.version.outputs.version }}'
          $dest = "VsMcp-${{ matrix.vs-target }}-$version.vsix"
          Copy-Item $src.FullName $dest

          $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLower()
          "$hash *$dest" | Out-File -FilePath "$dest.sha256" -Encoding ascii -NoNewline

          Write-Host "Artifact: $dest ($([math]::Round($src.Length / 1KB, 1)) KB)"
          Write-Host "SHA256: $hash"
          "filename=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VsMcp-${{ matrix.vs-target }}
          path: |
            ${{ steps.package.outputs.filename }}
            ${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (读 annotated tag message 作为 release body)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # release body：参考 MaaEnd 简化版——不分类，按时间正序（旧→新）线性列出提交标题 +
      # PR(若 commit 标题自带 (#N)) + 作者。范围：上一个 tag..当前 tag（首次发布则全历史）。
      - name: 生成 release body
        shell: bash
        run: |
          git fetch --tags --force origin "refs/tags/${{ github.ref_name }}"
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "## ${{ github.ref_name }}"
            echo ""
            git log --no-merges --reverse --pretty=format:"- %s  @%an" "$RANGE"
            echo ""
          } > release_body.md
          echo "=== release_body.md ==="; cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
